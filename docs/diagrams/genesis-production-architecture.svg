,sans-serif" font-size="12" font-weight="normal" fill="#566e73">Provider key + HL client secret</text><text x="1131" y="500" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#566e73">Token encryption key</text><rect x="1115" y="670" width="250" height="110" rx="10" fill="#fff" stroke="#bed2d2" stroke-width="1.5" /><text x="1131" y="698" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173d3c">Cloud Logging</text><text x="1131" y="721" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#566e73">Generation + CRM events</text><text x="1131" y="740" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#566e73">Cloud Monitoring metrics</text><rect x="1480" y="235" width="250" height="110" rx="10" fill="#fff" stroke="#bed2d2" stroke-width="1.5" /><text x="1496" y="263" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173d3c">HighLevel</text><text x="1496" y="286" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#566e73">Marketplace OAuth</text><text x="1496" y="305" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#566e73">Contacts / conversations / calendars</text><rect x="1480" y="670" width="250" height="110" rx="10" fill="#fff" stroke="#bed2d2" stroke-width="1.5" /><text x="1496" y="698" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173d3c">AI provider</text><text x="1496" y="721" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#566e73">Configured model endpoint</text><text x="1496" y="740" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#566e73">OpenAI-compatible API</text><path d="M300 225 H325 V292 H350" fill="none" stroke="#375e70" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="325" cy="250" r="13" fill="#dbf2e8" stroke="#599b84" stroke-width="1.4"/><text x="321" y="254" font-