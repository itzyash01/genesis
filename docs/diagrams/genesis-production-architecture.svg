ill="#fff" stroke="#d5e3df" stroke-width="1.5" /><text x="60" y="935" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#174e43">NUMBERED FLOWS</text><circle cx="72" cy="970" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="68" y="974" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">1</text><text x="96" y="975" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Hosting serves the frontend</text><circle cx="72" cy="1009" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="68" y="1013" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">2</text><text x="96" y="1014" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Firebase Auth supplies user identity</text><circle cx="72" cy="1048" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="68" y="1052" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">3</text><text x="96" y="1053" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Workspace invokes callable functions</text><circle cx="72" cy="1087" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="68" y="1091" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">4</text><text x="96" y="1092" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Functions read / write Firestore</text><circle cx="72" cy="1126" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="68" y="1130" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">5</text><text x="96" y="1131" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Workspace starts generation</text><circle cx="72" cy="1165" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="68" y="1169" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">6</text><text x="96" y="1170" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Generation streams SSE to workspace</text><circle cx="72" cy="1204" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="68" y="1208" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">7</text><text x="96" y="1209" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Preview uses the workspace bridge</text><circle cx="912" cy="970" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="908" y="974" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">8</text><text x="936" y="975" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Functions call HighLevel CRM APIs</text><circle cx="912" cy="1009" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="908" y="1013" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">9</text><text x="936" y="1014" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">HighLevel redirects to OAuth callback</text><circle cx="912" cy="1048" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="904" y="1052" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">10</text><text x="936" y="1053" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">OAuth handler accesses credentials</text><circle cx="912" cy="1087" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="904" y="1091" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">11</text><text x="936" y="1092" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Generation calls the configured model</text><circle cx="912" cy="1126" r="12" fill="#dbf2e8" stroke="#599b84"/><text x="904" y="1130" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#075940">12</text><text x="936" y="1131" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#354e53">Generation emits operational logs</text><text x="60" y="1280" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#617878">Additional server-side persistence and logging are described in the accompanying architecture document.</text><text x="60" y="1304" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#617878">Generation uses the OpenAI SDK with a configurable provider; dashboards and alerts are not configured.</text></svg>